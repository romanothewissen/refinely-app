app:
  id: ari:cloud:ecosystem::app/c2222793-707f-4f79-b0ca-66356a03ba2f
  licensing:
    enabled: true
  runtime:
    name: nodejs22.x

modules:
  jira:globalPage:
    - key: story-generator-page
      resource: main
      resolver:
        function: resolver
      title: Refinely
      route: story-generator
  jira:issueAction:
    - key: story-generator-issue-action
      resource: main
      resolver:
        function: resolver
      title: Generate Backlog
      viewportSize: max
  sql:
    - key: main
      engine: mysql
  function:
    - key: resolver
      handler: resolvers/index.handler
    - key: quick-refine-consumer
      handler: queues/quick-refine.handler
      timeoutSeconds: 180
    - key: generation-consumer
      handler: queues/generation.handler
      timeoutSeconds: 900
    - key: clarify-consumer
      handler: queues/clarify.handler
      timeoutSeconds: 180
    - key: v2-generation-consumer
      handler: queues/v2-generation.handler
      timeoutSeconds: 900
    - key: v3-preview-consumer
      handler: queues/v3-preview.handler
      timeoutSeconds: 900
    - key: refine-consumer
      handler: queues/refine.handler
      timeoutSeconds: 180
    - key: backlog-cache-refresh
      handler: queues/backlog-cache-refresh.handler
      timeoutSeconds: 900
    - key: project-memory-refresh
      handler: queues/project-memory-refresh.handler
      timeoutSeconds: 900
    - key: project-memory-schedule
      handler: queues/project-memory-schedule.handler
      timeoutSeconds: 900
  consumer:
    - key: quick-refine-consumer-listener
      queue: quick-refine-queue
      function: quick-refine-consumer
    - key: generation-consumer-listener
      queue: generation-queue
      function: generation-consumer
    - key: clarify-consumer-listener
      queue: clarify-queue
      function: clarify-consumer
    - key: v2-generation-consumer-listener
      queue: v2-generation-queue
      function: v2-generation-consumer
    - key: v3-preview-consumer-listener
      queue: v3-preview-queue
      function: v3-preview-consumer
    - key: refine-consumer-listener
      queue: refine-queue
      function: refine-consumer
    - key: backlog-cache-refresh-listener
      queue: backlog-cache-refresh-queue
      function: backlog-cache-refresh
    - key: project-memory-refresh-listener
      queue: project-memory-refresh-queue
      function: project-memory-refresh
  scheduledTrigger:
    - key: project-memory-weekly
      function: project-memory-schedule
      interval: week
resources:
  - key: main
    path: src/frontend/build

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
  external:
    fetch:
      backend:
        - address: https://api.anthropic.com
        - address: https://generativelanguage.googleapis.com
        - address: https://api.openai.com
        - address: https://api.fireworks.ai
        - address: https://ollama.com
        - address: https://api.groq.com
